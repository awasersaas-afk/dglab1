<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- SEO Meta Tags -->
    <title>منصة مختبرات الإبداع | DGAC Creative Labs</title>
    <meta name="description" content="منصة رقمية لتمكين الشباب التونسي من تحويل أفكارهم الثقافية إلى مشاريع واقعية" />
    <meta name="keywords" content="مختبرات الإبداع, DGAC, تونس, الشباب, المشاريع الثقافية, الإبداع" />
    <meta name="author" content="DGAC Tunisia" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="منصة مختبرات الإبداع | DGAC" />
    <meta property="og:description" content="تمكين الشباب من تحويل أفكارهم الثقافية إلى مشاريع واقعية" />
    <meta property="og:locale" content="ar_TN" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مختبرات الإبداع" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Fonts - Cairo (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <!-- Accessibility: Skip to main content -->
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #facc15;
        color: #0f172a;
        padding: 8px 16px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 0 0 8px 0;
        z-index: 100;
      }
      .skip-link:focus {
        top: 0;
      }
      
      /* Loading Screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid #334155;
        border-top-color: #facc15;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* RTL Support */
      [dir="rtl"] {
        text-align: right;
      }
      
      /* Focus visible for accessibility */
      *:focus-visible {
        outline: 2px solid #facc15;
        outline-offset: 2px;
      }
      
      /* High contrast mode support */
      @media (prefers-contrast: high) {
        body {
          --tw-ring-color: #000;
        }
      }
      
      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Skip to main content link for screen readers -->
    <a href="#main-content" class="skip-link">
      الانتقال إلى المحتوى الرئيسي
    </a>
    
    <!-- Loading Screen -->
    <div id="loading-screen" aria-live="polite" aria-label="جاري تحميل المنصة">
      <div class="loader" role="status">
        <span class="sr-only">جاري التحميل...</span>
      </div>
    </div>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Screen Reader Announcements -->
    <div 
      id="sr-announcements" 
      class="sr-only" 
      role="status" 
      aria-live="polite" 
      aria-atomic="true"
    ></div>
    
    <script type="module" src="/index.tsx"></script>
    
    <!-- Hide loading screen when app loads -->
    <script>
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          setTimeout(() => {
            loadingScreen.classList.add('hidden');
          }, 500);
        }
      });
      
      // Announce route changes to screen readers
      let lastPathname = '';
      const observer = new MutationObserver(() => {
        const currentPathname = window.location.hash;
        if (currentPathname !== lastPathname) {
          lastPathname = currentPathname;
          const announcer = document.getElementById('sr-announcements');
          if (announcer) {
            const pageName = currentPathname.replace('#/', '') || 'الصفحة الرئيسية';
            announcer.textContent = `تم الانتقال إلى ${pageName}`;
          }
        }
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true,
      });
    </script>
  </body>
</html>
